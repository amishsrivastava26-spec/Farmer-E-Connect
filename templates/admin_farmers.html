<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Farmers</title>
    <link rel="stylesheet" href="{{ url_for('style') }}">
    <style>
        body { font-family: Arial, sans-serif; padding: 24px; background: #f3f8ef; }
        main { max-width: 1000px; margin: auto; background: white; padding: 24px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
        th { background: #228b22; color: white; }
    </style>
</head>
<body>
    <main>
        <h1>Registered Farmers</h1>
        <p><a href="{{ url_for('admin_dashboard') }}">Back to dashboard</a></p>
        <table>
            <thead><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Village</th><th>PIN</th><th>Crop</th></tr></thead>
            <tbody>
                {% for farmer in farmers %}
                <tr>
                    <td>{{ farmer[0] }}</td><td>{{ farmer[1] }}</td><td>{{ farmer[2] }}</td>
                    <td>{{ farmer[3] }}</td><td>{{ farmer[4] }}</td><td>{{ farmer[5] }}</td>
                </tr>
                {% else %}
                <tr><td colspan="6">No farmers are registered yet.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </main>
</body>
</html>
