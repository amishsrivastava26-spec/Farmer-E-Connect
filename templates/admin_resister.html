<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration</title>

    <link rel="stylesheet" href="{{ url_for('style') }}">
</head>

<style>
    ```css
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #eaf5e9;
    font-family: Arial, sans-serif;
}

.admin-register {
    width: 400px;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
}

.admin-register form {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.admin-register h2 {
    text-align: center;
    color: #006400;
    font-size: 26px;
}

.subtitle {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-top: -10px;
}

.admin-register input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
}

.admin-register input:focus {
    border-color: #228B22;
    box-shadow: 0 0 5px rgba(34, 139, 34, 0.2);
}

.admin-register button {
    padding: 13px;
    background: linear-gradient(90deg, #006400, #228B22);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.admin-register button:hover {
    background: #004d00;
}
```
</style>

<body>

    <section class="admin-register">

        <form action="/admin_register" method="POST">

            <h2>Admin Registration</h2>
            {% if message %}<p>{{ message }}</p>{% endif %}

            <p class="subtitle">Create your administrator account</p>

            <input type="text" name="name" placeholder="Enter Full Name" required>

            <input type="tel" name="mobile" placeholder="Enter Mobile Number"
                pattern="[0-9]{10}" maxlength="10" required>

            <input type="password" name="password" placeholder="Create Password" required>

            <input type="password" name="confirm_password" placeholder="Confirm Password" required>

            <button type="submit">Register Admin</button>

        </form>

    </section>

</body>
</html>
