<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer E Connct Register</title>
</head>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #eaf5e9;
    font-family: Arial, sans-serif;
}

.register {
    width: 400px;
    background-color: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
}

.register form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.register h2 {
    text-align: center;
    color: #006400;
    margin-bottom: 10px;
    font-size: 26px;
}

.register input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
}

.register input:focus {
    border-color: #228B22;
    box-shadow: 0 0 5px rgba(34, 139, 34, 0.2);
}

.register button {
    padding: 13px;
    background: linear-gradient(90deg, #006400, #228B22);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.register button:hover {
    background: #004d00;
}

   
</style>


<body>
    <section class="register">
        <form action="/register" method="POST">
            <h2>Farmer Registration</h2>
            {% if message %}<p>{{ message }}</p>{% endif %}
            <input type="text" name="name" placeholder="Name (this is your username)" required>
            <input type="tel" name="mobile" placeholder="Mobile number" required>
            <input type="text" name="village" placeholder="Village" required>
            <input type="number" name="village_pin" placeholder="Village PIN code" required>
            <input type="text" name="crop" placeholder="Main crop" required>
            <input type="password" name="password" placeholder="Create password" required>

            <button type="submit">Register</button>

        </form>
    </section>
</body>

</html>
