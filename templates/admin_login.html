
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <link rel="stylesheet" href="{{ url_for('style') }}">
</head>

<style>
    ```css
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #eaf5e9;
    font-family: Arial, sans-serif;
}

/* Admin Login Card */
.admin-login {
    width: 380px;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
}

/* Form */
.admin-login form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* Heading */
.admin-login h2 {
    text-align: center;
    color: #006400;
    font-size: 26px;
}

.admin-login .subtitle {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-top: -10px;
}

/* Input Fields */
.admin-login input:not([type="checkbox"]) {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
}

.admin-login input:focus {
    border-color: #228B22;
}

/* Show Password */
.admin-login .show-password {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: -10px;
}

.admin-login input[type="checkbox"] {
    width: 16px;
    height: 16px;
    margin: 0;
    accent-color: #228B22;
    cursor: pointer;
}

.admin-login .show-password label {
    font-size: 14px;
    color: #444;
    cursor: pointer;
}

/* Login Button */
.admin-login button {
    width: 100%;
    padding: 13px;
    background: linear-gradient(90deg, #006400, #228B22);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.admin-login button:hover {
    background: #004d00;
}
```
</style>

<body>

    <section class="admin-login">

        <form action="/admin_login" method="POST">

            <h2>Admin Login</h2>
            {% if message %}<p>{{ message }}</p>{% endif %}

            <p class="subtitle">Login to your Admin Dashboard</p>

            <input type="text" name="mobile" placeholder="Enter Mobile Number"
                pattern="[0-9]{10}" maxlength="10" required>

            <input type="text" name="name" placeholder="Admin name (username)" required>

            <input type="password" name="password" placeholder="Enter Password" required>

            <button type="submit">Login</button>
            <p><a href="{{ url_for('admin_register') }}">Create an admin account</a></p>

        </form>

    </section>

</body>
</html>
